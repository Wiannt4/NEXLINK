<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0a10">
  <title>Login — NEXLINK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">N</span><span>NEXLINK</span></a>
    <nav class="header-nav"><a class="nav-login" href="index.html">← Kembali</a></nav>
  </header>
  <main class="auth-layout">
    <section class="auth-aside">
      <div class="eyebrow"><span class="status-dot"></span> WELCOME BACK</div>
      <h1>Senang melihatmu <span>lagi.</span></h1>
      <p>Satu langkah lagi menuju ruang digital milikmu.</p>
      <div class="auth-decoration"><span>n.</span><i></i><i></i><i></i></div>
    </section>
    <section class="auth-card">
      <div class="auth-card-heading"><span class="auth-kicker">MASUK KE AKUNMU</span><h2>Login</h2><p>Masukkan detail akun NEXLINK-mu.</p></div>
      <form id="login-form" class="form-stack">
        <label class="field-label" for="login-email">Email</label>
        <input class="text-input" id="login-email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
        <div class="label-row"><label class="field-label" for="login-password">Password</label></div>
        <div class="password-wrap"><input class="text-input" id="login-password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="Tampilkan password">Lihat</button></div>
        <button class="button button-primary button-full" type="submit">Login <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">Belum punya akun? <a href="register.html">Buat akun</a></p>
      <p class="auth-note">Demo lokal: akun disimpan hanya di browser ini.</p>
    </section>
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
</body>
</html>
